<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD Skeletal Animation - Three.js Example</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            max-width: 400px;
            font-size: 14px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 8px 16px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 0;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .slider {
            width: 200px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="loading">Loading USD file...</div>

    <div id="info" style="display: none;">
        <h3>USD Skeletal Animation Example</h3>
        <div id="stats"></div>
    </div>

    <div id="controls" style="display: none;">
        <button id="playPauseBtn">Pause</button>
        <label>Speed:</label>
        <input type="range" id="speedSlider" class="slider" min="0" max="2" step="0.1" value="1">
        <span id="speedValue">1.0x</span>
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TinyUSDZLoader } from '../src/tinyusdz/TinyUSDZLoader.js';
        import {
            createSkinnedMeshFromUSD,
            playAnimation
        } from '../src/tinyusdz/USDSkeletalHelper.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(
            50,
            window.innerWidth / window.innerHeight,
            0.01,
            1000
        );
        camera.position.set(2, 1, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('container').appendChild(renderer.domElement);

        // Orbit controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // Grid helper
        const gridHelper = new THREE.GridHelper(10, 10);
        scene.add(gridHelper);

        // Animation state
        let mixer = null;
        let clock = new THREE.Clock();
        let animationAction = null;
        let isPlaying = true;

        // Load USD file
        async function loadUSDFile(filePath) {
            try {
                const loader = new TinyUSDZLoader();
                await loader.init({ useMemory64: false });

                console.log('Loading USD file:', filePath);

                const usd = await new Promise((resolve, reject) => {
                    loader.load(
                        filePath,
                        resolve,
                        (progress) => {
                            console.log('Loading progress:', progress);
                        },
                        reject
                    );
                });

                console.log('USD file loaded successfully');

                // Get scene info
                const numMeshes = usd.numMeshes();
                const numSkeletons = usd.numSkeletons();
                const numAnimations = usd.numAnimations();

                console.log(`Meshes: ${numMeshes}, Skeletons: ${numSkeletons}, Animations: ${numAnimations}`);

                // Display info
                document.getElementById('stats').innerHTML = `
                    <strong>File:</strong> ${filePath.split('/').pop()}<br>
                    <strong>Meshes:</strong> ${numMeshes}<br>
                    <strong>Skeletons:</strong> ${numSkeletons}<br>
                    <strong>Animations:</strong> ${numAnimations}
                `;

                // Load first skinned mesh if available
                if (numMeshes > 0 && numSkeletons > 0) {
                    const mesh = usd.getMesh(0);

                    if (mesh.skel_id !== undefined && mesh.skel_id >= 0) {
                        console.log('Creating skinned mesh...');

                        // Create material
                        const material = new THREE.MeshStandardMaterial({
                            color: 0x3399ff,
                            skinning: true,
                            roughness: 0.7,
                            metalness: 0.3
                        });

                        // Create skinned mesh with animation
                        const animId = numAnimations > 0 ? 0 : undefined;
                        const result = createSkinnedMeshFromUSD(
                            usd,
                            0,  // mesh id
                            mesh.skel_id,  // skeleton id
                            animId,  // animation id
                            { material, fps: 24 }
                        );

                        // Add to scene
                        scene.add(result.mesh);

                        // Setup animation if available
                        if (result.animationClip) {
                            console.log('Setting up animation:', result.animationClip.name);
                            mixer = playAnimation(result.mesh, result.animationClip, { loop: true });

                            // Get the action for controls
                            animationAction = mixer._actions[0];

                            // Show controls
                            document.getElementById('controls').style.display = 'flex';
                        }

                        // Add skeleton helper for visualization
                        const skeletonHelper = new THREE.SkeletonHelper(result.mesh);
                        skeletonHelper.material.linewidth = 2;
                        scene.add(skeletonHelper);

                        console.log('Skinned mesh created successfully');
                    } else {
                        console.warn('Mesh is not skinned');
                    }
                }

                // Hide loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('info').style.display = 'block';

            } catch (error) {
                console.error('Error loading USD file:', error);
                document.getElementById('loading').textContent = 'Error: ' + error.message;
            }
        }

        // Controls
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (animationAction) {
                if (isPlaying) {
                    animationAction.paused = true;
                    document.getElementById('playPauseBtn').textContent = 'Play';
                } else {
                    animationAction.paused = false;
                    document.getElementById('playPauseBtn').textContent = 'Pause';
                }
                isPlaying = !isPlaying;
            }
        });

        document.getElementById('speedSlider').addEventListener('input', (e) => {
            const speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = speed.toFixed(1) + 'x';
            if (animationAction) {
                animationAction.timeScale = speed;
            }
        });

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Update mixer
            if (mixer) {
                mixer.update(delta);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Start
        animate();

        // Load default file (change this to your USD file path)
        const defaultFile = '../assets/CesiumMan.usdz';
        loadUSDFile(defaultFile);

    </script>
</body>
</html>
