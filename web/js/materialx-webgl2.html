<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyUSDZ MaterialX WebGL2 Demo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container.drag-over {
            box-shadow: inset 0 0 50px rgba(76, 175, 80, 0.5);
        }

        #canvas-container.drag-over::after {
            content: 'Drop USD file here';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #4CAF50;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            min-width: 280px;
            max-width: 350px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        #info-panel h2 {
            margin: 0 0 5px 0;
            font-size: 16px;
            font-weight: 500;
            color: #4CAF50;
        }

        #info-panel .subtitle {
            font-size: 11px;
            color: #888;
            margin-bottom: 12px;
        }

        #status {
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #model-info {
            display: none;
            font-size: 12px;
            line-height: 1.8;
        }

        #model-info span {
            color: #4CAF50;
            font-weight: 500;
        }

        #nodegraph-info {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
        }

        #nodegraph-info h3 {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: #2196F3;
        }

        .node-list {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            padding: 8px;
        }

        .node-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .node-item:last-child {
            border-bottom: none;
        }

        .node-name {
            color: #FFD54F;
        }

        .node-type {
            color: #81D4FA;
            font-size: 10px;
        }

        #toolbar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: #388E3C;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.secondary {
            background: #2196F3;
        }

        .btn.secondary:hover {
            background: #1976D2;
        }

        .btn.warning {
            background: #FF9800;
        }

        .btn.warning:hover {
            background: #F57C00;
        }

        #file-input {
            display: none;
        }

        #help-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 11px;
            color: #888;
            line-height: 1.6;
        }

        #help-overlay kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        #toast.visible {
            opacity: 1;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #loading-overlay.visible {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 8px;
        }

        .badge.webgl2 {
            background: #4CAF50;
            color: white;
        }

        .badge.optimized {
            background: #FF9800;
            color: white;
        }

        @media (max-width: 768px) {
            #toolbar {
                flex-wrap: wrap;
                max-width: 90%;
            }

            #info-panel {
                max-width: calc(100% - 20px);
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Info Panel -->
    <div id="info-panel">
        <h2>MaterialX WebGL2 Demo <span class="badge webgl2">WebGL2</span></h2>
        <div class="subtitle">Blender MaterialX Node Graph Support</div>
        <div id="status">Initializing...</div>
        <div id="model-info">
            <div>Meshes: <span id="mesh-count">0</span></div>
            <div>Materials: <span id="material-count">0</span></div>
        </div>
        <div id="nodegraph-info">
            <h3>NodeGraph Details</h3>
            <div>Original nodes: <span id="original-nodes">0</span></div>
            <div>Optimized nodes: <span id="optimized-nodes">0</span></div>
            <div>Reduction: <span id="node-reduction">0%</span></div>
            <div class="node-list" id="node-list"></div>
        </div>
    </div>

    <!-- Toolbar -->
    <div id="toolbar">
        <button class="btn" onclick="loadFile()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Load USD
        </button>
        <button class="btn secondary" onclick="loadSample()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <path d="M9 9h6v6H9z"/>
            </svg>
            Sample
        </button>
        <button class="btn warning" onclick="toggleOptimization()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span id="opt-label">Optimize</span>
        </button>
        <input type="file" id="file-input" accept=".usd,.usda,.usdc,.usdz">
    </div>

    <!-- Help Overlay -->
    <div id="help-overlay">
        <kbd>Drag & Drop</kbd> USD files to load |
        <kbd>Scroll</kbd> to zoom |
        <kbd>Drag</kbd> to orbit |
        <kbd>Right-drag</kbd> to pan
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- Import maps for Three.js ES modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
                "tinyusdz/": "./src/tinyusdz/"
            }
        }
    </script>

    <!-- Main application script -->
    <script type="module" src="materialx-webgl2.js"></script>
</body>
</html>
