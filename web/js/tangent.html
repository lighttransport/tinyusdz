<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LightUSD Tangent Space Demo</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101318;
        color: #e7eef7;
      }
      canvas { display: block; }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: min(360px, calc(100vw - 24px));
        padding: 12px;
        background: rgba(16, 19, 24, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        box-sizing: border-box;
      }
      #panel h1 {
        margin: 0 0 10px;
        font-size: 16px;
        font-weight: 650;
      }
      .row {
        display: grid;
        grid-template-columns: 116px 1fr;
        gap: 10px;
        align-items: center;
        margin: 8px 0;
        font-size: 13px;
      }
      select, input[type="range"], button {
        width: 100%;
        box-sizing: border-box;
      }
      button, select {
        color: #e7eef7;
        background: #202733;
        border: 1px solid #3a4556;
        border-radius: 6px;
        padding: 6px 8px;
      }
      input[type="range"] { accent-color: #62c7aa; }
      #stats {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #b9c7d8;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>Tangent Space Normal Mapping</h1>
      <div class="row">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="precomputed">Precomputed TBN</option>
          <option value="derivative">Derivative TBN</option>
          <option value="split">Split Compare</option>
          <option value="normal">Normal Only</option>
        </select>
      </div>
      <div class="row">
        <label for="preset">Mesh</label>
        <select id="preset">
          <option value="medium">Medium grid</option>
          <option value="seams">UV seams</option>
          <option value="large">Large grid</option>
        </select>
      </div>
      <div class="row">
        <label for="scale">Normal scale</label>
        <input id="scale" type="range" min="0" max="2" value="1" step="0.01">
      </div>
      <div class="row">
        <label></label>
        <button id="rebuild">Rebuild Mesh</button>
      </div>
      <div id="stats"></div>
    </div>
    <script type="module" src="./tangent.js"></script>
  </body>
</html>
