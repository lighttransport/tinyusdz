<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>TinyUSDZ Three.js Skeletal Animation Demo</title>
		<style>
			body {
				margin: 0;
				overflow: hidden;
				font-family: Arial, sans-serif;
			}
			canvas {
				display: block;
			}
			#info {
				position: absolute;
				top: 10px;
				left: 10px;
				color: white;
				background: rgba(0, 0, 0, 0.7);
				padding: 10px;
				border-radius: 5px;
				font-size: 14px;
				max-width: 400px;
			}
			#info h3 {
				margin-top: 0;
				margin-bottom: 10px;
				color: #6bb6ff;
			}
			#info p {
				margin: 5px 0;
				font-size: 12px;
			}
			#file-controls {
				margin-top: 10px;
				padding-top: 10px;
				border-top: 1px solid rgba(255, 255, 255, 0.2);
			}
			#fileInput {
				display: none;
			}
			.button {
				display: inline-block;
				padding: 6px 12px;
				background: #4CAF50;
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				font-size: 12px;
				margin-right: 5px;
			}
			.button:hover {
				background: #45a049;
			}
			#animation-info {
				margin-top: 10px;
				padding-top: 10px;
				border-top: 1px solid rgba(255, 255, 255, 0.2);
				font-size: 11px;
				color: #95e06c;
			}
			.animation-list {
				margin-top: 5px;
				max-height: 150px;
				overflow-y: auto;
			}
			.animation-item {
				padding: 3px 5px;
				margin: 2px 0;
				background: rgba(255, 255, 255, 0.1);
				border-radius: 3px;
			}
			#skeleton-info {
				margin-top: 10px;
				padding-top: 10px;
				border-top: 1px solid rgba(255, 255, 255, 0.2);
				font-size: 11px;
				color: #ff9966;
			}
		</style>
	</head>
	<body>
		<div id="info">
			<h3>TinyUSDZ Skeletal Animation Demo</h3>
			<p>
				This demo shows USD skeletal animation (SkelAnimation) extraction and playback using Three.js SkinnedMesh.<br>
				Load a USD file with skeletal animations to see character rigs in action.
			</p>
			<p>
				<strong>Current file:</strong> <span id="currentFile">No file loaded</span>
			</p>
			<div id="file-controls">
				<input type="file" id="fileInput" accept=".usd,.usda,.usdc,.usdz">
				<button class="button" onclick="document.getElementById('fileInput').click()">Load USD File</button>
			</div>
			<div id="skeleton-info" style="display:none;">
				<strong>Skeleton Information:</strong>
				<div id="skeletonDetails"></div>
			</div>
			<div id="animation-info" style="display:none;">
				<strong>Skeletal Animations Found:</strong>
				<div class="animation-list" id="animationList"></div>
			</div>
		</div>

		<script type="module">
			// Handle file upload
			document.getElementById('fileInput').addEventListener('change', async (event) => {
				const file = event.target.files[0];
				if (!file) return;

				document.getElementById('currentFile').textContent = file.name;

				// Trigger custom event that skining-anim.js can listen to
				const customEvent = new CustomEvent('loadUSDFile', {
					detail: { file }
				});
				window.dispatchEvent(customEvent);
			});

			// Function to update skeleton information display
			window.updateSkeletonInfo = function(skeletonCount, totalJoints) {
				const skelInfo = document.getElementById('skeleton-info');
				const skelDetails = document.getElementById('skeletonDetails');

				if (skeletonCount > 0) {
					skelInfo.style.display = 'block';
					skelDetails.innerHTML = `Skeletons: ${skeletonCount}<br>Total Joints: ${totalJoints}`;
				} else {
					skelInfo.style.display = 'none';
				}
			};

			// Function to update animation list display
			window.updateAnimationList = function(animations, animationInfos) {
				const animInfo = document.getElementById('animation-info');
				const animList = document.getElementById('animationList');

				if (animations && animations.length > 0) {
					animInfo.style.display = 'block';
					animList.innerHTML = '';

					animations.forEach((anim, index) => {
						const item = document.createElement('div');
						item.className = 'animation-item';

						// Get animation type information if available
						let jointInfo = '';
						if (animationInfos && animationInfos[index]) {
							const info = animationInfos[index];
							if (info.has_skeletal_animation) {
								jointInfo = ` <span style="color: #ff9966;">[Skeletal]</span>`;
							}
						}

						const trackCount = anim.tracks ? anim.tracks.length : 0;
						item.innerHTML = `<strong>${index}:</strong> ${anim.name || 'Unnamed'} - ${anim.duration.toFixed(2)}s, ${trackCount} tracks${jointInfo}`;
						animList.appendChild(item);
					});
				} else {
					animInfo.style.display = 'none';
				}
			};
		</script>

		<script type="module" src="./skining-anim.js"></script>
	</body>
</html>
