<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Animation Blending - TinyUSDZ Demo</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="./demos.css">
		<style>
			.blend-panel {
				display: flex;
				flex-direction: column;
				gap: 10px;
				overflow-y: auto;
				padding: 14px;
				min-width: 0;
				background: var(--panel);
				border-left: 1px solid var(--line);
			}
			.blend-section {
				margin-bottom: 4px;
			}
			.blend-section h3 {
				margin: 0 0 6px;
				color: var(--muted);
				font-size: .72rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: .04em;
			}
			.clip-row {
				padding: 8px;
				background: var(--panel-2);
				border: 1px solid var(--line);
				border-radius: 6px;
				margin-bottom: 6px;
			}
			.clip-row .row-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 4px;
			}
			.clip-row .clip-name {
				font-size: .82rem;
				font-weight: 600;
				color: var(--text);
			}
			.clip-row .clip-note {
				font-size: .7rem;
				color: var(--dim);
			}
			.clip-row .weight-control {
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.clip-row input[type="range"] { flex: 1; min-width: 0; }
			.clip-row .weight-val {
				min-width: 3ch;
				text-align: right;
				font-size: .82rem;
				font-variant-numeric: tabular-nums;
				color: var(--accent);
			}
			.btn-row {
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
			}
			.btn-row button {
				flex: 1;
				padding: 6px;
				border: 1px solid var(--line-strong);
				border-radius: 4px;
				background: var(--panel-2);
				color: var(--text);
				cursor: pointer;
				font-size: .78rem;
				font-weight: 600;
				transition: background .12s, color .12s;
			}
			.btn-row button:hover { background: var(--panel-3); }
			.btn-row button.primary { background: var(--accent); color: #121214; border-color: var(--accent); }
			.btn-row button.primary:hover { opacity: .85; }
			.timeline-row {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.timeline-row .track {
				flex: 1;
				height: 24px;
				position: relative;
				cursor: pointer;
				min-width: 0;
			}
			.timeline-row .track .bg {
				position: absolute; inset: 8px 0;
				background: var(--panel-3);
				border-radius: 3px;
				overflow: hidden;
			}
			.timeline-row .track .fill {
				height: 100%;
				background: var(--accent);
				border-radius: 3px;
				opacity: .6;
				transition: width 50ms linear;
			}
			.timeline-row .track .scrubber {
				position: absolute;
				top: 2px;
				width: 3px;
				height: 20px;
				background: var(--accent);
				border-radius: 2px;
				pointer-events: none;
				transition: left 50ms linear;
			}
			.timeline-row .time-label {
				color: var(--text);
				font-size: .78rem;
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
				min-width: 12ch;
			}
			.info-grid {
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 3px 12px;
				font-size: .78rem;
			}
			.info-grid .k { color: var(--dim); }
			.info-grid .v { color: var(--text); font-variant-numeric: tabular-nums; }
		</style>
	</head>
	<body class="demo-view">
		<div id="demo-root"></div>
		<script type="module" src="./src/entries/animation-blending.js"></script>
	</body>
</html>
