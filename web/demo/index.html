<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>TinyUSDZ Web Demos</title>
		<meta name="description" content="TinyUSDZ browser demos for USD loading, MaterialX, UsdLux, skinning, animation, physics, composition, and export.">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="./demos.css">
		<link rel="preload" as="fetch" crossorigin="anonymous" href="./assets/tinyusdz.wasm">
	</head>
	<body>
		<div class="wrap">
			<nav class="topbar">
				<a class="wordmark" href="../">TinyUSDZ</a>
				<div class="navlinks">
					<a href="../">Home</a>
					<a href="https://github.com/lighttransport/tinyusdz" target="_blank" rel="noopener">GitHub</a>
					<a href="https://www.npmjs.com/package/tinyusdz" target="_blank" rel="noopener">npm</a>
				</div>
			</nav>

			<header class="header">
				<h1>TinyUSDZ Web Demo Foundation</h1>
				<p>Every demo uses the same USD loader, drag and drop file import, file picker, lil-gui controls, OrbitControls navigation, and F-to-fit viewport behavior.</p>
			</header>
		</div>

		<main class="container">
			<div style="margin-bottom:16px">
				<input id="demo-search" type="text" spellcheck="false" placeholder="Search demos by name or description…" style="width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);color:var(--text);font-size:.9rem;outline:none;transition:border-color .12s" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor=''" />
				<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap" id="demo-counts"></div>
			</div>
			<div class="demo-grid" data-demo-grid></div>
		</main>

		<footer class="footer wrap">
			<p><a href="https://github.com/lighttransport/tinyusdz/tree/release/web/demo" target="_blank" rel="noopener">View demo sources on GitHub</a></p>
		</footer>

		<script type="module" src="./src/entries/index.js"></script>
	</body>
</html>
