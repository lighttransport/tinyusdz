<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Streaming Loading Viz - TinyUSDZ Demo</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="./demos.css">
		<style>
			.viz-panel {
				display: flex;
				flex-direction: column;
				gap: 12px;
				padding: 14px;
				overflow-y: auto;
				min-width: 0;
				background: var(--panel);
				border-left: 1px solid var(--line);
			}
			.viz-section { }
			.viz-section h3 {
				margin: 0 0 6px;
				color: var(--muted);
				font-size: .72rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: .04em;
			}
			canvas.viz-canvas {
				width: 100%;
				height: 140px;
				border-radius: 4px;
				background: #0a0a0c;
				display: block;
			}
			.viz-table {
				width: 100%;
				border-collapse: collapse;
				font-size: .76rem;
			}
			.viz-table th {
				text-align: left;
				padding: 3px 6px;
				color: var(--dim);
				font-weight: 600;
				font-size: .7rem;
				text-transform: uppercase;
				border-bottom: 1px solid var(--line);
			}
			.viz-table td {
				padding: 3px 6px;
				color: var(--text);
				border-bottom: 1px solid var(--line-2);
				font-variant-numeric: tabular-nums;
			}
			.viz-table td.ok { color: var(--ok); }
			.viz-table td.err { color: var(--danger); }
			.viz-table td.muted { color: var(--dim); }
			.viz-summary {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 8px;
			}
			.viz-stat {
				padding: 8px 10px;
				background: var(--panel-2);
				border-radius: 4px;
				border: 1px solid var(--line);
			}
			.viz-stat .val {
				font-size: 1.1rem;
				font-weight: 700;
				color: var(--text);
			}
			.viz-stat .lbl {
				font-size: .68rem;
				color: var(--dim);
				text-transform: uppercase;
				font-weight: 600;
			}
		</style>
	</head>
	<body class="demo-view">
		<div id="demo-root"></div>
		<script type="module" src="./src/entries/streaming-viz.js"></script>
	</body>
</html>
