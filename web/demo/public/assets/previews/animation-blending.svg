<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#18181b"/>
  <rect x="24" y="20" width="320" height="320" rx="8" fill="#101013" stroke="#303038" stroke-width="1"/>
  <rect x="36" y="32" width="296" height="240" rx="4" fill="#0e0e10"/>
  <!-- Two skeleton poses side by side -->
  <g opacity="0.18" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <circle cx="120" cy="110" r="16"/>
    <line x1="120" y1="126" x2="120" y2="170"/>
    <line x1="120" y1="146" x2="96" y2="132"/>
    <line x1="120" y1="146" x2="144" y2="132"/>
    <line x1="120" y1="170" x2="100" y2="210"/>
    <line x1="120" y1="170" x2="140" y2="210"/>
  </g>
  <g opacity="0.18" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round">
    <circle cx="260" cy="105" r="16"/>
    <line x1="260" y1="121" x2="260" y2="168"/>
    <line x1="260" y1="146" x2="236" y2="128"/>
    <line x1="260" y1="146" x2="284" y2="128"/>
    <line x1="260" y1="168" x2="240" y2="208"/>
    <line x1="260" y1="168" x2="280" y2="208"/>
  </g>
  <!-- Blend arrow -->
  <text x="188" y="100" text-anchor="middle" fill="#b794f6" font-family="system-ui" font-size="16">⇄</text>
  <text x="188" y="130" text-anchor="middle" fill="#71717a" font-family="system-ui" font-size="8">BLEND</text>
  <!-- Blend controls panel -->
  <rect x="360" y="20" width="256" height="320" rx="8" fill="#202025" stroke="#303038" stroke-width="1"/>
  <!-- Clip A -->
  <rect x="372" y="32" width="232" height="68" rx="6" fill="#1c1c20" stroke="#38bdf8" stroke-width="1" stroke-opacity=".5"/>
  <rect x="372" y="32" width="3" height="68" rx="1" fill="#38bdf8"/>
  <text x="382" y="48" fill="#38bdf8" font-family="system-ui" font-size="9" font-weight="700">CLIP A</text>
  <text x="460" y="48" fill="#ededf0" font-family="system-ui" font-size="9">Idle</text>
  <text x="382" y="64" fill="#71717a" font-family="system-ui" font-size="8">Weight</text>
  <rect x="382" y="74" width="160" height="5" rx="2" fill="#303038"/>
  <rect x="382" y="74" width="112" height="5" rx="2" fill="#38bdf8"/>
  <text x="550" y="78" fill="#38bdf8" font-family="system-ui" font-size="9" font-weight="600">0.70</text>
  <!-- Clip B -->
  <rect x="372" y="108" width="232" height="68" rx="6" fill="#1c1c20" stroke="#a78bfa" stroke-width="1" stroke-opacity=".5"/>
  <rect x="372" y="108" width="3" height="68" rx="1" fill="#a78bfa"/>
  <text x="382" y="124" fill="#a78bfa" font-family="system-ui" font-size="9" font-weight="700">CLIP B</text>
  <text x="460" y="124" fill="#ededf0" font-family="system-ui" font-size="9">Wave</text>
  <text x="382" y="140" fill="#71717a" font-family="system-ui" font-size="8">Weight</text>
  <rect x="382" y="150" width="160" height="5" rx="2" fill="#303038"/>
  <rect x="382" y="150" width="48" height="5" rx="2" fill="#a78bfa"/>
  <text x="550" y="154" fill="#a78bfa" font-family="system-ui" font-size="9" font-weight="600">0.30</text>
  <!-- Buttons -->
  <rect x="372" y="186" width="148" height="26" rx="4" fill="#b794f6"/>
  <text x="446" y="203" text-anchor="middle" fill="#121214" font-family="system-ui" font-size="9" font-weight="700">Crossfade A→B</text>
  <rect x="528" y="186" width="76" height="26" rx="4" fill="#303038"/>
  <text x="566" y="203" text-anchor="middle" fill="#a0a0a8" font-family="system-ui" font-size="8">50/50</text>
  <!-- Info -->
  <rect x="372" y="224" width="232" height="60" rx="4" fill="#1c1c20" stroke="#303038" stroke-width=".5"/>
  <text x="380" y="242" fill="#71717a" font-family="system-ui" font-size="8">Clips</text><text x="590" y="242" text-anchor="end" fill="#ededf0" font-family="system-ui" font-size="8">3</text>
  <text x="380" y="256" fill="#71717a" font-family="system-ui" font-size="8">Duration</text><text x="590" y="256" text-anchor="end" fill="#ededf0" font-family="system-ui" font-size="8">3.0 s</text>
  <text x="380" y="270" fill="#71717a" font-family="system-ui" font-size="8">Blend</text><text x="590" y="270" text-anchor="end" fill="#f59e0b" font-family="system-ui" font-size="8">Manual</text>
  <!-- Timeline bar at bottom of viewport -->
  <rect x="36" y="280" width="296" height="28" rx="4" fill="#1c1c20" stroke="#303038" stroke-width=".5"/>
  <rect x="44" y="294" width="200" height="4" rx="2" fill="#303038"/>
  <rect x="44" y="294" width="120" height="4" rx="2" fill="#b794f6" opacity=".5"/>
  <rect x="164" y="290" width="3" height="12" rx="1" fill="#b794f6"/>
  <text x="256" y="298" fill="#a0a0a8" font-family="system-ui" font-size="8">1.50 / 3.00s</text>
  <!-- Labels -->
  <text x="32" y="14" fill="#b794f6" font-family="system-ui" font-size="11" font-weight="600">ANIMATION BLENDING</text>
</svg>
