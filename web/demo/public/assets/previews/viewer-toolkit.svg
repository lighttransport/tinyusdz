<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#18181b"/>
  <rect x="24" y="20" width="380" height="320" rx="8" fill="#101013" stroke="#303038" stroke-width="1"/>
  <rect x="36" y="32" width="356" height="296" rx="4" fill="#0e0e10"/>
  <!-- Teapot shape in different colors showing shading modes -->
  <g opacity="0.12">
    <ellipse cx="214" cy="210" rx="32" ry="20"/>
    <path d="M188 190 Q214 140 240 190Z"/>
    <rect x="206" y="140" width="16" height="30" rx="3"/>
  </g>
  <!-- Blue wireframe overlay -->
  <g opacity="0.15" fill="none" stroke="#38bdf8" stroke-width="1">
    <ellipse cx="214" cy="210" rx="32" ry="20"/>
    <path d="M188 190 Q214 140 240 190Z"/>
  </g>
  <!-- Toolbar chips -->
  <rect x="36" y="248" width="56" height="18" rx="4" fill="#b794f6"/>
  <text x="64" y="260" text-anchor="middle" fill="#121214" font-family="system-ui" font-size="7" font-weight="700">SHADED</text>
  <rect x="98" y="248" width="58" height="18" rx="4" fill="#303038"/>
  <text x="127" y="260" text-anchor="middle" fill="#a0a0a8" font-family="system-ui" font-size="7">WIREFRAME</text>
  <rect x="162" y="248" width="42" height="18" rx="4" fill="#303038"/>
  <text x="183" y="260" text-anchor="middle" fill="#a0a0a8" font-family="system-ui" font-size="7">FLAT</text>
  <rect x="210" y="248" width="58" height="18" rx="4" fill="#303038"/>
  <text x="239" y="260" text-anchor="middle" fill="#a0a0a8" font-family="system-ui" font-size="7">TEXTURED</text>
  <!-- Controls panel -->
  <rect x="420" y="20" width="196" height="320" rx="8" fill="#202025" stroke="#303038" stroke-width="1"/>
  <rect x="432" y="32" width="172" height="180" rx="4" fill="#1c1c20" stroke="#303038" stroke-width=".5"/>
  <!-- Checkbox toggles -->
  <rect x="440" y="42" width="12" height="12" rx="2" fill="#b794f6"/>
  <text x="458" y="52" fill="#ededf0" font-family="system-ui" font-size="9">Wireframe Overlay</text>
  <rect x="440" y="60" width="12" height="12" rx="2" fill="#b794f6"/>
  <text x="458" y="70" fill="#ededf0" font-family="system-ui" font-size="9">Backface Culling</text>
  <rect x="440" y="78" width="12" height="12" rx="2" fill="#b794f6"/>
  <text x="458" y="88" fill="#ededf0" font-family="system-ui" font-size="9">Grid</text>
  <rect x="440" y="96" width="12" height="12" rx="2" fill="#26262c"/>
  <text x="458" y="106" fill="#a0a0a8" font-family="system-ui" font-size="9">Axes</text>
  <line x1="440" y1="115" x2="596" y2="115" stroke="#303038" stroke-width=".5"/>
  <!-- Exposure slider -->
  <text x="440" y="132" fill="#ededf0" font-family="system-ui" font-size="9">Exposure</text>
  <rect x="440" y="138" width="130" height="5" rx="2" fill="#303038"/>
  <circle cx="510" cy="140" r="5" fill="#b794f6"/>
  <text x="576" y="143" fill="#ededf0" font-family="system-ui" font-size="9">1.00</text>
  <!-- Scene stats -->
  <rect x="432" y="222" width="172" height="106" rx="4" fill="#1c1c20" stroke="#303038" stroke-width=".5"/>
  <text x="518" y="240" text-anchor="middle" fill="#a0a0a8" font-family="system-ui" font-size="8" font-weight="600">SCENE</text>
  <text x="440" y="258" fill="#71717a" font-family="system-ui" font-size="8">Meshes</text><text x="590" y="258" text-anchor="end" fill="#ededf0" font-family="system-ui" font-size="8">4</text>
  <text x="440" y="272" fill="#71717a" font-family="system-ui" font-size="8">Materials</text><text x="590" y="272" text-anchor="end" fill="#ededf0" font-family="system-ui" font-size="8">3</text>
  <text x="440" y="286" fill="#71717a" font-family="system-ui" font-size="8">Triangles</text><text x="590" y="286" text-anchor="end" fill="#ededf0" font-family="system-ui" font-size="8">1.2K</text>
  <text x="440" y="300" fill="#71717a" font-family="system-ui" font-size="8">FPS</text><text x="590" y="300" text-anchor="end" fill="#34d399" font-family="system-ui" font-size="8">60</text>
  <text x="32" y="14" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="600">VIEWER TOOLKIT</text>
</svg>
